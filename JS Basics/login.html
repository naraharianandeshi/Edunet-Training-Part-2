<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — RecipeCards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">RecipeCards</a>
      <nav class="nav">
        <a href="index.html">Recipes</a>
        <a href="products.html">Products</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="auth-wrap">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" required>
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" required>
        </div>
        <div class="form-row">
          <button class="btn" type="submit">Login</button>
        </div>
        <div class="muted">Don't have an account? <a href="signup.html">Sign up</a></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const users = JSON.parse(localStorage.getItem('users')||'[]');
      const user = users.find(u=>u.email===email && u.password===password);
      if(user){
        localStorage.setItem('loggedIn', JSON.stringify({email}));
        window.location.href = 'index.html';
      }else{
        alert('Invalid credentials — try signing up');
      }
    });
  </script>
</body>
</html>
