{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fashion{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'fashion/css/style.css' %}">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="/">FASHION</a>
        <nav class="main-nav">
          <a href="/category/kids/">KIDS</a>
          <a href="/category/women/">WOMEN</a>
          <a href="/category/men/">MEN</a>
        </nav>
      </div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Fashion Store. All Rights Reserved.</p>
      </div>
    </footer>
  </body>
</html>
